<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Los Libros del Día{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="{{ url_for('web.index') }}" class="brand"><span class="brand-icon">📖</span> Los Libros del Día</a>
            <nav class="nav-links">
                <a href="{{ url_for('web.index') }}">Inicio</a>
                <a href="{{ url_for('web.buscar') }}">Búsqueda</a>
                <a href="{{ url_for('web.agregar_formulario') }}">Agregar</a>
                <a href="{{ url_for('web.prestados') }}">Prestados</a>
                <a href="{{ url_for('web.descargados') }}">Descargados</a>
            </nav>
        </div>
    </header>
    <main class="main-content">{% block content %}{% endblock %}</main>
    <footer class="footer"><div class="container"><p>© 2025 Los Libros del Día. Biblioteca digital</p></div></footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
