{% extends "base.html" %}
{% block title %}Editar libro{% endblock %}
{% block content %}
<section class="container form-section"><div class="page-header"><div><p class="eyebrow">Actualizar</p><h1>Editar libro</h1></div></div>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<form class="card-form" method="POST" action="{{ url_for('web.editar', id_libro=libro.id) }}"><div class="form-grid">
<div class="form-group"><label for="titulo">Título</label><input type="text" id="titulo" name="titulo" value="{{ libro.titulo }}" required></div>
<div class="form-group"><label for="autor">Autor</label><input type="text" id="autor" name="autor" value="{{ libro.autor }}" required></div>
<div class="form-group"><label for="genero">Género</label><input type="text" id="genero" name="genero" value="{{ libro.genero }}" required></div>
<div class="form-group"><label for="anio_publicacion">Año de publicación</label><input type="number" id="anio_publicacion" name="anio_publicacion" value="{{ libro.anio_publicacion }}" min="0" required></div>
</div><div class="form-actions"><button type="submit" class="btn btn-primary">Actualizar libro</button><a href="{{ url_for('web.index') }}" class="btn btn-secondary">Cancelar</a></div></form></section>
{% endblock %}
