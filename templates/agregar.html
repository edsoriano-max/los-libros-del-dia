{% extends "base.html" %}
{% block title %}Agregar libro{% endblock %}
{% block content %}
<section class="container form-section"><div class="page-header"><div><p class="eyebrow">Agregar</p><h1>Registrar nuevo libro</h1></div></div>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<form class="card-form" method="POST" action="{{ url_for('web.agregar') }}"><div class="form-grid">
<div class="form-group"><label for="titulo">Título</label><input type="text" id="titulo" name="titulo" required></div>
<div class="form-group"><label for="autor">Autor</label><input type="text" id="autor" name="autor" required></div>
<div class="form-group"><label for="genero">Género</label><input type="text" id="genero" name="genero" required></div>
<div class="form-group"><label for="anio_publicacion">Año de publicación</label><input type="number" id="anio_publicacion" name="anio_publicacion" min="0" required></div>
</div><div class="form-actions"><button type="submit" class="btn btn-primary">Guardar libro</button><a href="{{ url_for('web.index') }}" class="btn btn-secondary">Cancelar</a></div></form></section>
{% endblock %}
